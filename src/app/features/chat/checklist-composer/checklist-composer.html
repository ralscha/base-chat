<form
  class="rounded-xl border border-base-300 bg-base-200 p-3 mb-3 space-y-3"
  aria-labelledby="checklist-composer-heading"
  (submit)="send($event)"
>
  <div class="flex items-center justify-between gap-2">
    <h2 id="checklist-composer-heading" class="font-semibold text-sm">New shared checklist</h2>
    <button type="button" class="btn btn-ghost btn-xs" (click)="canceled.emit()">
      Cancel checklist
    </button>
  </div>
  <label class="block text-sm">
    <span class="block mb-1">Title</span>
    <input
      #titleInput
      type="text"
      class="input input-sm w-full"
      placeholder="Weekend plans"
      [maxLength]="titleLimit"
      [value]="title()"
      [disabled]="blocked()"
      (input)="updateTitle($event)"
      required
    />
  </label>
  <label class="block text-sm">
    <span class="block mb-1">Items, one per line</span>
    <textarea
      class="textarea w-full text-sm"
      rows="3"
      placeholder="Book train tickets&#10;Pack a picnic"
      aria-describedby="checklist-items-help"
      [value]="itemsText()"
      [disabled]="blocked()"
      (input)="updateItems($event)"
      required
    ></textarea>
  </label>
  <p id="checklist-items-help" class="text-xs text-base-content/60">
    Up to {{ itemLimit }} items, {{ itemLengthLimit }} characters each. Both participants can update
    the list.
  </p>
  @if (error()) {
    <p role="alert" class="text-error text-sm">{{ error() }}</p>
  }
  <div class="flex justify-end">
    <button
      type="submit"
      class="btn btn-primary btn-sm"
      [disabled]="blocked() || !title().trim() || !itemsText().trim()"
    >
      Send checklist
    </button>
  </div>
</form>
