<button
  class="btn btn-ghost btn-circle btn-sm text-base-content/70 hover:bg-base-200 hover:text-base-content"
  [attr.aria-label]="
    themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
  "
  (click)="themeService.toggle()"
>
  @if (themeService.theme() === 'dark') {
    <!-- Sun icon -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M12 3v1m0 16v1m8.66-9h-1M4.34 12h-1m15.07-6.07-.71.71M6.34 17.66l-.71.71M17.66 17.66l-.71-.71M6.34 6.34l-.71-.71M12 7a5 5 0 1 0 0 10A5 5 0 0 0 12 7z"
      />
    </svg>
  } @else {
    <!-- Moon icon -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"
      />
    </svg>
  }
</button>
