<div class="relative inline-flex shrink-0">
  <div
    class="rounded-full flex items-center justify-center font-semibold text-white select-none"
    [class]="sizeClasses() + ' ' + color()"
  >
    {{ initials() }}
  </div>
  @if (showPresence()) {
    <span
      class="absolute bottom-0 right-0 rounded-full border-2 border-base-100"
      [class]="presenceDotSize() + (online() ? ' bg-success' : ' bg-base-300')"
    ></span>
  }
</div>
